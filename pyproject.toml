[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xmcd"
version = "0.4.0"
description = "Procedural Mathcad XML worksheets without Mathcad or COM"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "nickadminroot" },
]
requires-python = ">=3.11"
dependencies = [
    "lxml>=6.1.3",
]
keywords = ["mathcad", "xmcd", "scientific-computing", "xml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/nickadminroot/xmcd"
Repository = "https://github.com/nickadminroot/xmcd"
Issues = "https://github.com/nickadminroot/xmcd/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/xmcd"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
